name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: model · data, train, evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.9.2
      - name: Lint
        run: ruff check app ml scripts
      - name: Generate dataset
        run: python ml/generate_data.py --users 800 --sessions 3 --seed 23
      - name: Train and evaluate
        run: python ml/train.py --factors 24 --iterations 12
      - name: Assert the model beats the popularity baseline
        run: |
          python - <<'PY'
          import json, pathlib, sys
          metrics = json.loads(pathlib.Path("ml/artifacts/metrics.json").read_text())
          offline = metrics["offline"]["ndcg_at_10"]
          print("ndcg@10:", offline)
          if offline["two_stage"] <= offline["popularity"]:
              sys.exit(f"two-stage NDCG {offline['two_stage']} did not beat popularity {offline['popularity']}")
          auc = metrics["ranker"]["train_auc"]
          if auc < 0.75:
              sys.exit(f"ranker AUC too low: {auc}")
          print("model quality gate passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: ml/artifacts/metrics.json

  service:
    name: service · boot and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build dataset and model
        run: |
          python ml/generate_data.py --users 800 --sessions 3 --seed 23
          python ml/train.py --factors 24 --iterations 12
      - name: Boot the API
        env:
          APP_ENV: ci
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8200 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8200/health >/dev/null && break; sleep 2; done
      - name: Smoke test
        run: python scripts/smoke.py --users 60 --steps 4

  storefront:
    name: storefront · typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCKS: "true"

  image:
    name: image · build and push
    runs-on: ubuntu-latest
    needs: [model, service, storefront]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/streamrank-api:1.0.0
            ghcr.io/${{ github.repository_owner }}/streamrank-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Storefront image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: NEXT_PUBLIC_USE_MOCKS=false
          tags: |
            ghcr.io/${{ github.repository_owner }}/streamrank-storefront:1.0.0
            ghcr.io/${{ github.repository_owner }}/streamrank-storefront:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
